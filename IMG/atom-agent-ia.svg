<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="Núcleo de un agente de IA con electrones orbitando — atom-agent-ia (Agent as a Service)">
  <style>
    .aai-orbit{fill:none;stroke:#454545;stroke-width:1.4}
    .aai-orbit.hi{stroke:#727272}
    .aai-electron{fill:#fff}
    .aai-core{fill:#fff}
    .aai-halo{fill:none;stroke:#fff;stroke-opacity:.22;stroke-width:1}
    .aai-pulse{fill:none;stroke:#fff;stroke-width:1.2;opacity:0;transform-box:view-box;transform-origin:180px 100px}
    .aai-spin{transform-box:view-box;transform-origin:180px 100px}
    .aai-o1{transform:rotate(0deg);animation:aai-s1 9s linear infinite}
    .aai-o2{transform:rotate(60deg);animation:aai-s2 12s linear infinite}
    .aai-o3{transform:rotate(120deg);animation:aai-s3 15s linear infinite}
    @keyframes aai-s1{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes aai-s2{from{transform:rotate(60deg)}to{transform:rotate(420deg)}}
    @keyframes aai-s3{from{transform:rotate(120deg)}to{transform:rotate(-240deg)}}
    .aai-core{animation:aai-breathe 3.2s ease-in-out infinite}
    @keyframes aai-breathe{0%,100%{opacity:1}50%{opacity:.55}}
    .aai-pulse{animation:aai-ping 3.6s ease-out infinite}
    .aai-pulse.p2{animation-delay:1.8s}
    @keyframes aai-ping{0%{transform:scale(.35);opacity:.5}70%{opacity:0}100%{transform:scale(1.75);opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .aai-o1,.aai-o2,.aai-o3,.aai-core{animation:none}
      .aai-pulse{display:none}
    }
  </style>
  <circle class="aai-pulse" cx="180" cy="100" r="28"/>
  <circle class="aai-pulse p2" cx="180" cy="100" r="28"/>
  <g class="aai-spin aai-o1">
    <ellipse class="aai-orbit hi" cx="180" cy="100" rx="92" ry="33"/>
    <circle class="aai-electron" cx="272" cy="100" r="4"/>
  </g>
  <g class="aai-spin aai-o2">
    <ellipse class="aai-orbit" cx="180" cy="100" rx="92" ry="33"/>
    <circle class="aai-electron" cx="272" cy="100" r="3.4"/>
  </g>
  <g class="aai-spin aai-o3">
    <ellipse class="aai-orbit" cx="180" cy="100" rx="92" ry="33"/>
    <circle class="aai-electron" cx="272" cy="100" r="3.4"/>
  </g>
  <circle class="aai-halo" cx="180" cy="100" r="15"/>
  <circle class="aai-core" cx="180" cy="100" r="8"/>
</svg>
